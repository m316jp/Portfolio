<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!--
  記事サムネイル（1200×630）／articles/voice-input-for-ai-at-home/cover.png の生成用
  書き出し： bash design/thumbnails/build.sh articles を実行（Google Chrome を使用）
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141413; --ink-soft:#3c3c39; --gray:#73736d; --gray-light:#a5a59e;
    --line:#e4e3dc; --paper:#f7f6f2; --accent:#f2c40f;
    --font-en:'Space Grotesk','Helvetica Neue',sans-serif;
    --font-jp:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;}
  body{background:var(--paper);font-family:var(--font-jp);color:var(--ink);-webkit-font-smoothing:antialiased;}

  .card{position:relative;width:1200px;height:630px;padding:72px 80px;display:flex;flex-direction:column;}
  .card::before{content:"";position:absolute;inset:28px;border:1px solid var(--line);pointer-events:none;}

  .eyebrow{
    display:flex;align-items:center;gap:14px;
    font-family:var(--font-en);font-size:19px;font-weight:600;
    letter-spacing:0.3em;text-transform:uppercase;color:var(--gray);
  }
  .eyebrow::before{content:"";width:40px;height:1px;background:var(--ink);flex:none;}

  .headline{
    margin-top:auto;
    font-size:78px;font-weight:900;line-height:1.35;letter-spacing:0.02em;
  }
  .mark{background:linear-gradient(transparent 58%, rgba(242,196,15,0.55) 58%);padding:0 .08em;}

  .sub{
    margin-top:28px;
    font-size:27px;font-weight:500;line-height:1.7;letter-spacing:0.04em;color:var(--ink-soft);
  }

  .foot{margin-top:44px;display:flex;align-items:baseline;justify-content:space-between;}
  .byline{font-size:20px;font-weight:700;letter-spacing:0.08em;}
  .domain{font-family:var(--font-en);font-size:18px;letter-spacing:0.12em;color:var(--gray-light);}
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Essay</p>

    <h1 class="headline">母の手は、<br>よく<span class="mark">ふさがっている</span>。</h1>
    <p class="sub">声で入力する、家庭のAI活用</p>

    <div class="foot">
      <span class="byline">宮崎真理 ｜ AI×家事</span>
      <span class="domain">miyazakimari.com</span>
    </div>
  </div>
</body>
</html>
