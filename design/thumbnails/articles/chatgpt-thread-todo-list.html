<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
  :root { --night:#14120f; --text:#fff; --accent:#f2c40f; --font:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN',sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body { background:var(--night); color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased; }
  .card { width:1200px; height:630px; padding:58px 62px; display:flex; flex-direction:column; justify-content:center; }
  h1 { font-size:76px; font-weight:900; line-height:1.38; letter-spacing:.01em; }
  .hl { color:var(--accent); }
  .foot { display:flex; align-items:center; gap:20px; margin-top:36px; font-size:40px; font-weight:900; }
  .foot::before { content:""; width:50px; height:7px; background:var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <h1>ChatGPTの<br>スレッド一覧が、<br>私の<span class="hl">ToDoリスト</span>になった</h1>
    <div class="foot">宮崎真理　『AI×家事』著者</div>
  </div>
</body>
</html>
