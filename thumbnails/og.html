<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- サイト共通OGP画像（1200×630）。note のリンクカードは中央だけ切り出すため、要素は中央に寄せ左右に余白を取る。build.sh で書き出し -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141413; --ink-soft:#3c3c39; --gray:#73736d; --gray-light:#a5a59e;
    --line:#e4e3dc; --paper:#f7f6f2; --accent:#f2c40f;
    --font-en:'Space Grotesk','Helvetica Neue',sans-serif;
    --font-jp:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;}
  body{background:var(--paper);font-family:var(--font-jp);color:var(--ink);-webkit-font-smoothing:antialiased;}

  .card{position:relative;width:1200px;height:630px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:54px;}

  /* 中央セーフゾーン。note で切り出されても収まる幅 */
  .inner{width:720px;display:flex;flex-direction:column;align-items:center;}

  .eyebrow{
    display:flex;align-items:center;gap:14px;
    font-family:var(--font-en);font-size:18px;font-weight:600;
    letter-spacing:0.34em;text-transform:uppercase;color:var(--gray);
  }
  .eyebrow::before,.eyebrow::after{content:"";width:34px;height:1px;background:var(--ink);flex:none;}

  .headline{
    margin-top:30px;
    font-size:56px;font-weight:900;line-height:1.36;letter-spacing:0.02em;
  }
  .mark{background:linear-gradient(transparent 58%, rgba(242,196,15,0.55) 58%);padding:0 .08em;}

  .book{
    margin-top:34px;
    height:226px;width:auto;border-radius:4px;
    box-shadow:0 20px 44px -20px rgba(0,0,0,.42);
  }

  .foot{
    margin-top:28px;
    display:flex;align-items:center;gap:14px;
    font-size:17px;letter-spacing:0.05em;color:var(--gray);
  }
  .foot .name{font-weight:700;color:var(--ink-soft);letter-spacing:0.08em;}
  .foot .dot{width:4px;height:4px;border-radius:50%;background:var(--gray-light);}
  .foot .domain{font-family:var(--font-en);letter-spacing:0.1em;color:var(--gray-light);}
</style>
</head>
<body>
  <div class="card">
    <div class="inner">
      <p class="eyebrow">Miyazaki Mari</p>
      <h1 class="headline">生成AIで、<br>暮らしを<span class="mark">ラクに</span>。</h1>
      <img class="book" src="../AI_kaji.webp" alt="">
      <div class="foot">
        <span class="name">『AI×家事』著者・宮崎真理</span>
        <span class="dot"></span>
        <span class="domain">miyazakimari.com</span>
      </div>
    </div>
  </div>
</body>
</html>
